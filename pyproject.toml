[project]
name = "apple-financial-research-agent"
version = "0.1.0"
requires-python = "==3.11.*"

[tool.pytest.ini_options]
# tests/conftest.py isolates temporary files; avoid caches shared across Windows accounts.
addopts = "-p no:cacheprovider"
markers = [
  "gemini_integration: requires GEMINI_API_KEY and RUN_GEMINI_INTEGRATION=1",
]
