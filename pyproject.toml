[project]
name = "apple-financial-research-agent"
version = "0.1.0"
requires-python = "==3.11.*"

[tool.pytest.ini_options]
# Keep pytest temporary files inside this ignored project directory.
addopts = "--basetemp=.pytest_tmp/run"
markers = [
  "gemini_integration: requires GEMINI_API_KEY and RUN_GEMINI_INTEGRATION=1",
]
